<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>servEX</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#89b4fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </span>
        <h1>servEX</h1>
        <span class="version-badge">v.0.6.0</span>
        <button class="action-btn" id="btn-update" title="GitHubからアップデート">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          アップデート
        </button>
        <button class="action-btn" id="btn-restart" title="servEXサービスを再起動">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
          再起動
        </button>
      </div>
      <div class="header-center">
        <span class="pane-label" id="pane-label">上ペイン</span>
      </div>
      <div class="header-right">
        <button class="action-btn" id="btn-upload" title="アップロード">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          アップロード
        </button>
        <button class="action-btn" id="btn-mkdir" title="フォルダ作成">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          新規フォルダ
        </button>
        <button class="action-btn" id="btn-createfile" title="新規ファイル">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          新規ファイル
        </button>
      </div>
    </header>

    <div class="main-container">
      <!-- Left Sidebar: Folder Tree (top + bottom) -->
      <aside class="left-sidebar" id="left-sidebar">
        <div class="tree-pane" id="tree-pane-top">
          <div class="sidebar-header">
            <h3>上ツリー</h3>
            <button class="tree-refresh-btn" id="tree-refresh-top" title="ツリーを更新">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            </button>
          </div>
          <div class="tree-container" id="tree-container-top"></div>
        </div>
        <div class="tree-pane" id="tree-pane-bottom">
          <div class="sidebar-header">
            <h3>下ツリー</h3>
            <button class="tree-refresh-btn" id="tree-refresh-bottom" title="ツリーを更新">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            </button>
          </div>
          <div class="tree-container" id="tree-container-bottom"></div>
        </div>
      </aside>
      <div class="resize-handle" id="resize-handle-left"></div>

      <!-- Dual Pane -->
      <div class="dual-pane" id="dual-pane">
        <!-- Upper Pane -->
        <div class="pane" id="pane-top">
          <div class="pane-header">
            <div class="path-bar">
              <button class="path-btn" data-pane="top" data-action="home" title="ホーム">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2"/></svg>
              </button>
              <button class="path-btn" data-pane="top" data-action="up" title="親フォルダ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
              <button class="path-btn" data-pane="top" data-action="refresh" title="更新">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
              </button>
              <input type="text" class="path-input" id="path-top" placeholder="/" readonly>
            </div>
            <div class="pane-actions">
              <button class="pane-btn active" data-pane="top" data-view="list" title="リスト表示">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </button>
              <button class="pane-btn" data-pane="top" data-view="thumb" title="サムネイル表示">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              </button>
            </div>
          </div>
          <div class="file-list-wrapper" data-pane="top">
            <div class="file-list" id="file-list-top"></div>
          </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle-h" id="resize-handle-h"></div>

        <!-- Lower Pane -->
        <div class="pane" id="pane-bottom">
          <div class="pane-header">
            <div class="path-bar">
              <button class="path-btn" data-pane="bottom" data-action="home" title="ホーム">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2"/></svg>
              </button>
              <button class="path-btn" data-pane="bottom" data-action="up" title="親フォルダ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
              <button class="path-btn" data-pane="bottom" data-action="refresh" title="更新">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
              </button>
              <input type="text" class="path-input" id="path-bottom" placeholder="/" readonly>
            </div>
            <div class="pane-actions">
              <button class="pane-btn active" data-pane="bottom" data-view="list" title="リスト表示">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </button>
              <button class="pane-btn" data-pane="bottom" data-view="thumb" title="サムネイル表示">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              </button>
            </div>
          </div>
          <div class="file-list-wrapper" data-pane="bottom">
            <div class="file-list" id="file-list-bottom"></div>
          </div>
        </div>
      </div>

      <!-- Resize Handle -->
      <div class="resize-handle-v" id="resize-handle-v"></div>

      <!-- Right Sidebar -->
      <aside class="right-sidebar" id="right-sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="info">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            情報
          </button>
          <button class="sidebar-tab" data-tab="terminal">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            ターミナル
          </button>
        </div>

        <!-- Info Panel -->
        <div class="sidebar-content" id="tab-info">
          <div class="info-empty">
            <p>ファイルやフォルダを選択してください</p>
          </div>
          <div class="info-detail" id="info-detail" style="display:none">
            <div class="info-icon" id="info-icon"></div>
            <div class="info-name" id="info-name"></div>
            <div class="info-path" id="info-path"></div>
            <table class="info-table">
              <tr><td>サイズ</td><td id="info-size">-</td></tr>
              <tr><td>種類</td><td id="info-type">-</td></tr>
              <tr><td>更新日時</td><td id="info-modified">-</td></tr>
              <tr><td>作成日時</td><td id="info-created">-</td></tr>
              <tr><td>所有者</td><td id="info-owner">-</td></tr>
              <tr><td>グループ</td><td id="info-group">-</td></tr>
              <tr><td>権限</td><td id="info-perms">-</td></tr>
            </table>
            <div class="info-actions">
              <h4>権限変更</h4>
              <div class="perm-row">
                <label>所有者:</label>
                <select id="perm-owner" class="perm-select"></select>
              </div>
              <div class="perm-row">
                <label>グループ:</label>
                <select id="perm-group" class="perm-select"></select>
              </div>
              <div class="perm-row">
                <label>権限:</label>
                <div class="perm-checkboxes">
                  <div class="perm-group">
                    <span class="perm-label">所有者</span>
                    <label><input type="checkbox" id="perm-r-user"> r</label>
                    <label><input type="checkbox" id="perm-w-user"> w</label>
                    <label><input type="checkbox" id="perm-x-user"> x</label>
                  </div>
                  <div class="perm-group">
                    <span class="perm-label">グループ</span>
                    <label><input type="checkbox" id="perm-r-group"> r</label>
                    <label><input type="checkbox" id="perm-w-group"> w</label>
                    <label><input type="checkbox" id="perm-x-group"> x</label>
                  </div>
                  <div class="perm-group">
                    <span class="perm-label">その他</span>
                    <label><input type="checkbox" id="perm-r-other"> r</label>
                    <label><input type="checkbox" id="perm-w-other"> w</label>
                    <label><input type="checkbox" id="perm-x-other"> x</label>
                  </div>
                </div>
              </div>
              <button class="btn primary" id="btn-apply-perms">適用</button>
            </div>
          </div>
        </div>

        <!-- Terminal Panel -->
        <div class="sidebar-content" id="tab-terminal" style="display:none">
          <div class="terminal-toolbar">
            <button class="btn" id="btn-open-terminal" title="選択フォルダでターミナルを開く">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              フォルダで開く
            </button>
            <button class="btn" id="btn-terminal-root" title="rootで再起動">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
              root
            </button>
            <button class="btn danger" id="btn-clear-terminal">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              クリア
            </button>
          </div>
          <div id="terminal-container"></div>
        </div>
      </aside>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="status-bar">
      <span id="status-text">準備完了</span>
      <span id="status-info"></span>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="context-menu">
    <div class="menu-item" data-action="open">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      開く
    </div>
    <div class="menu-item" data-action="copy">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      コピー
    </div>
    <div class="menu-item" data-action="move">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 004 4h12"/></svg>
      移動
    </div>
    <div class="menu-item" data-action="download">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      ダウンロード
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="rename">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      名前変更
    </div>
    <div class="menu-item" data-action="mkdir">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      フォルダ作成
    </div>
    <div class="menu-item" data-action="createfile">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      ファイル作成
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="copy-path">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      パスをコピー
    </div>
    <div class="menu-item" data-action="open-terminal">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      ターミナルで開く
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item danger" data-action="delete">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      削除
    </div>
  </div>

  <!-- Tree Context Menu -->
  <div class="context-menu" id="tree-context-menu">
    <div class="menu-item" data-taction="mkdir">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      フォルダ作成
    </div>
    <div class="menu-item" data-taction="createfile">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      ファイル作成
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-taction="rename">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      名前変更
    </div>
    <div class="menu-item" data-taction="copy-path">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      パスをコピー
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item danger" data-taction="delete">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      削除
    </div>
  </div>

  <!-- Dialogs -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog" id="dialog">
      <div class="dialog-header">
        <h3 id="dialog-title">ダイアログ</h3>
        <button class="dialog-close" id="dialog-close">&times;</button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-footer" id="dialog-footer">
        <button class="btn" id="dialog-cancel">キャンセル</button>
        <button class="btn primary" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- D&D Action Dialog -->
  <div class="dialog-overlay" id="dd-dialog-overlay">
    <div class="dialog" style="width:320px">
      <div class="dialog-header">
        <h3 id="dd-dialog-title">どうしますか？</h3>
      </div>
      <div class="dialog-body" style="text-align:center;padding:20px">
        <p id="dd-dialog-desc" style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)"></p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn primary" id="dd-btn-move" style="width:100%">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 004 4h12"/></svg>
            移動
          </button>
          <button class="btn" id="dd-btn-copy" style="width:100%">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle;margin-right:4px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            コピー
          </button>
          <button class="btn" id="dd-btn-cancel" style="width:100%">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Dialog -->
  <div class="dialog-overlay" id="upload-overlay">
    <div class="dialog" id="upload-dialog">
      <div class="dialog-header">
        <h3>アップロード</h3>
        <button class="dialog-close" onclick="document.getElementById('upload-overlay').classList.remove('show')">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="upload-zone" id="upload-zone">
          <p>ファイルをドラッグ＆ドロップ</p>
          <p>またはクリックして選択</p>
          <input type="file" id="file-input" multiple style="display:none">
        </div>
        <div class="upload-list" id="upload-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
