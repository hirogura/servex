<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>servEX</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">📁</span>
        <h1>servEX</h1>
        <span class="version-badge">v.0.1.0</span>
        <button class="action-btn" id="btn-update" title="GitHubからアップデート">🔄 アップデート</button>
        <button class="action-btn" id="btn-restart" title="servEXサービスを再起動">🔁 再起動</button>
      </div>
      <div class="header-center">
        <span class="pane-label" id="pane-label">上ペイン</span>
      </div>
      <div class="header-right">
        <button class="action-btn" id="btn-upload" title="アップロード">⬆ アップロード</button>
        <button class="action-btn" id="btn-mkdir" title="フォルダ作成">📁 新規フォルダ</button>
        <button class="action-btn" id="btn-createfile" title="新規ファイル">📄 新規ファイル</button>
      </div>
    </header>

    <div class="main-container">
      <!-- Left: Dual Pane -->
      <div class="dual-pane" id="dual-pane">
        <!-- Upper Pane -->
        <div class="pane" id="pane-top">
          <div class="pane-header">
            <div class="path-bar">
              <button class="path-btn" data-pane="top" data-action="home" title="ホーム">🏠</button>
              <button class="path-btn" data-pane="top" data-action="up" title="親フォルダ">⬆</button>
              <button class="path-btn" data-pane="top" data-action="refresh" title="更新">🔄</button>
              <input type="text" class="path-input" id="path-top" placeholder="/" readonly>
            </div>
            <div class="pane-actions">
              <button class="pane-btn active" data-pane="top" data-view="list">📋</button>
              <button class="pane-btn" data-pane="top" data-view="thumb">🔲</button>
            </div>
          </div>
          <div class="file-list-wrapper" data-pane="top">
            <div class="file-list" id="file-list-top"></div>
          </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle-h" id="resize-handle-h"></div>

        <!-- Lower Pane -->
        <div class="pane" id="pane-bottom">
          <div class="pane-header">
            <div class="path-bar">
              <button class="path-btn" data-pane="bottom" data-action="home" title="ホーム">🏠</button>
              <button class="path-btn" data-pane="bottom" data-action="up" title="親フォルダ">⬆</button>
              <button class="path-btn" data-pane="bottom" data-action="refresh" title="更新">🔄</button>
              <input type="text" class="path-input" id="path-bottom" placeholder="/" readonly>
            </div>
            <div class="pane-actions">
              <button class="pane-btn active" data-pane="bottom" data-view="list">📋</button>
              <button class="pane-btn" data-pane="bottom" data-view="thumb">🔲</button>
            </div>
          </div>
          <div class="file-list-wrapper" data-pane="bottom">
            <div class="file-list" id="file-list-bottom"></div>
          </div>
        </div>
      </div>

      <!-- Resize Handle -->
      <div class="resize-handle-v" id="resize-handle-v"></div>

      <!-- Right Sidebar -->
      <aside class="right-sidebar" id="right-sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="info">ℹ️ 情報</button>
          <button class="sidebar-tab" data-tab="terminal">💻 ターミナル</button>
        </div>

        <!-- Info Panel -->
        <div class="sidebar-content" id="tab-info">
          <div class="info-empty">
            <p>ファイルやフォルダを選択してください</p>
          </div>
          <div class="info-detail" id="info-detail" style="display:none">
            <div class="info-icon" id="info-icon"></div>
            <div class="info-name" id="info-name"></div>
            <div class="info-path" id="info-path"></div>
            <table class="info-table">
              <tr><td>サイズ</td><td id="info-size">-</td></tr>
              <tr><td>種類</td><td id="info-type">-</td></tr>
              <tr><td>更新日時</td><td id="info-modified">-</td></tr>
              <tr><td>作成日時</td><td id="info-created">-</td></tr>
              <tr><td>所有者</td><td id="info-owner">-</td></tr>
              <tr><td>グループ</td><td id="info-group">-</td></tr>
              <tr><td>権限</td><td id="info-perms">-</td></tr>
            </table>
            <div class="info-actions">
              <h4>権限変更</h4>
              <div class="perm-row">
                <label>所有者:</label>
                <select id="perm-owner" class="perm-select"></select>
              </div>
              <div class="perm-row">
                <label>グループ:</label>
                <select id="perm-group" class="perm-select"></select>
              </div>
              <div class="perm-row">
                <label>権限:</label>
                <div class="perm-checkboxes">
                  <div class="perm-group">
                    <span class="perm-label">所有者</span>
                    <label><input type="checkbox" id="perm-r-user"> r</label>
                    <label><input type="checkbox" id="perm-w-user"> w</label>
                    <label><input type="checkbox" id="perm-x-user"> x</label>
                  </div>
                  <div class="perm-group">
                    <span class="perm-label">グループ</span>
                    <label><input type="checkbox" id="perm-r-group"> r</label>
                    <label><input type="checkbox" id="perm-w-group"> w</label>
                    <label><input type="checkbox" id="perm-x-group"> x</label>
                  </div>
                  <div class="perm-group">
                    <span class="perm-label">その他</span>
                    <label><input type="checkbox" id="perm-r-other"> r</label>
                    <label><input type="checkbox" id="perm-w-other"> w</label>
                    <label><input type="checkbox" id="perm-x-other"> x</label>
                  </div>
                </div>
              </div>
              <button class="btn primary" id="btn-apply-perms">適用</button>
            </div>
          </div>
        </div>

        <!-- Terminal Panel -->
        <div class="sidebar-content" id="tab-terminal" style="display:none">
          <div class="terminal-toolbar">
            <button class="btn" id="btn-open-terminal" title="選択フォルダでターミナルを開く">📂 フォルダで開く</button>
            <button class="btn danger" id="btn-clear-terminal">🗑️ クリア</button>
          </div>
          <div id="terminal-container"></div>
        </div>
      </aside>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="status-bar">
      <span id="status-text">準備完了</span>
      <span id="status-info"></span>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="context-menu">
    <div class="menu-item" data-action="open">📂 開く</div>
    <div class="menu-item" data-action="copy">📋 コピー</div>
    <div class="menu-item" data-action="move">📦 移動</div>
    <div class="menu-item" data-action="download">⬇ ダウンロード</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="rename">✏️ 名前変更</div>
    <div class="menu-item" data-action="mkdir">📁 フォルダ作成</div>
    <div class="menu-item" data-action="createfile">📄 ファイル作成</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="copy-path">📋 パスをコピー</div>
    <div class="menu-item" data-action="open-terminal">💻 ターミナルで開く</div>
    <div class="menu-divider"></div>
    <div class="menu-item danger" data-action="delete">🗑️ 削除</div>
  </div>

  <!-- Dialogs -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog" id="dialog">
      <div class="dialog-header">
        <h3 id="dialog-title">ダイアログ</h3>
        <button class="dialog-close" id="dialog-close">✕</button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-footer" id="dialog-footer">
        <button class="btn" id="dialog-cancel">キャンセル</button>
        <button class="btn primary" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Upload Dialog -->
  <div class="dialog-overlay" id="upload-overlay">
    <div class="dialog" id="upload-dialog">
      <div class="dialog-header">
        <h3>アップロード</h3>
        <button class="dialog-close" onclick="document.getElementById('upload-overlay').classList.remove('show')">✕</button>
      </div>
      <div class="dialog-body">
        <div class="upload-zone" id="upload-zone">
          <p>📁 ファイルをドラッグ&ドロップ</p>
          <p>またはクリックして選択</p>
          <input type="file" id="file-input" multiple style="display:none">
        </div>
        <div class="upload-list" id="upload-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
